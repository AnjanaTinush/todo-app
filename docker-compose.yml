version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: todo_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}  
      MYSQL_DATABASE: ${DB_NAME}           
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_fresh:/var/lib/mysql
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 5s

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: todo_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: ${DB_USER}           
      PMA_PASSWORD: ${DB_PASSWORD} 
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo_backend
    environment:
      PORT: ${PORT}                 
      DB_HOST: ${DB_HOST}         
      DB_PORT: 3306
      DB_USER: ${DB_USER}          
      DB_PASSWORD: ${DB_PASSWORD}   
      DB_NAME: ${DB_NAME}           
    ports:
      - "${PORT}:${PORT}"          
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo_network
    restart: on-failure

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}  
    container_name: todo_frontend
    environment:
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}   
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - todo_network

volumes:
  mysql_data_fresh:
    driver: local

networks:
  todo_network:
    driver: bridge