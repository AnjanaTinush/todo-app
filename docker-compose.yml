version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: todo_database
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: todo_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      timeout: 20s
      retries: 10
      interval: 5s

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: todo_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root123
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo_backend
    environment:
      PORT: 4000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: todo_db
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo_network
    restart: on-failure

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:4000/api
    container_name: todo_frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - todo_network

volumes:
  mysql_data:
    driver: local

networks:
  todo_network:
    driver: bridge